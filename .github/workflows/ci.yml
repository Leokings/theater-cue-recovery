name: contract-verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned verification tools
        run: python -m pip install --requirement requirements.txt
      - name: GenVM lint and semantic validation
        run: genvm-lint check contracts/theater_cue_recovery.py --json
      - name: GenVM-aware typecheck
        run: genvm-lint typecheck contracts/theater_cue_recovery.py
      - name: Offline contract and tooling tests
        run: pytest tests/direct -q
      - name: Evidence verifier self-test
        run: python scripts/verify_evidence.py --self-test
